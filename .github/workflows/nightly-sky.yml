name: Nightly sky

# Every night: ask OpenAI for one new Deep Sky category, validate it, schedule
# the next few nights, and commit skies.json. The hosting platform (Vercel or
# Netlify) redeploys on its own when it sees the new commit.
#
# Needs a repository secret OPENAI_API_KEY.
# Optional repository variable OPENAI_MODEL (default gpt-6-luna).

on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = midnight in Pakistan
  workflow_dispatch:

concurrency:
  group: nightly-sky
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write a new sky
        id: sky
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
        run: node scripts/generate-sky.mjs

      - name: Commit and push
        env:
          SKY_NAME: ${{ steps.sky.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deep-sky/skies.json
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Add sky: $SKY_NAME"
          git push
